[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logiled"
version = "0.1.0"
description = "Control lighting, DPI and polling rate of Logitech HID++ mice on Linux"
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
gui = ["PyGObject"]

[project.scripts]
logiled = "logiled.cli:main"

[tool.setuptools]
packages = ["logiled"]
